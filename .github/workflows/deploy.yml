name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: project-recovery-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and quality tools
        run: python -m pip install -e ".[dev]"
      - name: Release gate
        run: |
          pytest -q
          ruff check src tests
          ruff format --check src tests scripts
          mypy src
          python -m build
      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy tracked application artifact
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: .
      - name: Verify production readiness
        env:
          APP_URL: ${{ vars.AZURE_APP_URL }}
        run: |
          test -n "$APP_URL"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "$APP_URL/health/ready"; then exit 0; fi
            sleep 10
          done
          exit 1
