name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and quality tools
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src
